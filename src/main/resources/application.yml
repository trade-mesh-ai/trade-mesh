server:
  port: 8080

spring:
  application:
    name: trade-mesh

  # ─── R2DBC / PostgreSQL ───────────────────────────────────────────────────────
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trade_mesh_db}?schema=trade_mesh
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    pool:
      enabled: true
      initial-size: 2
      max-size: 10
      max-idle-time: 30m

  # ─── JDBC DataSource (used by Liquibase only) ─────────────────────────────────
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trade_mesh_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # ─── Liquibase ────────────────────────────────────────────────────────────────
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: trade_mesh
    liquibase-schema: trade_mesh

  # ─── Disable Spring SQL init (Liquibase handles schema) ───────────────────────
  sql:
    init:
      mode: never

  # ─── Redis ────────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}          # leave blank for no-auth local Redis Note: default is blank password on localhost
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# ─── Zerodha / Kite Connect ─────────────────────────────────────────────────────
zerodha:
  kite:
    api-key: ${ZERODHA_API_KEY}
    api-secret: ${ZERODHA_API_SECRET}
    redirect-url: ${ZERODHA_REDIRECT_URL:http://localhost:8080/zerodha/callback}
    base-url: https://api.kite.trade
    login-url: https://kite.zerodha.com/connect/login
    access-token-ttl-hours: 8

  # ─── KiteTicker WebSocket ──────────────────────────────────────────────────────
  ticker:
    instruments:
      # NIFTY 50 index instrument token
      nifty50-token: 256265
      # NIFTY BANK index instrument token
      niftybank-token: 260105
    # Redis TTL (seconds) for cached tick prices
    price-cache-ttl-seconds: 60
    # WebSocket health-check interval (milliseconds)
    health-check-interval-ms: 30000
    # Max consecutive reconnect attempts before escalating to ERROR log (default: 10 cycles = 5 minutes)
    max-reconnect-alerts: 10

# ─── SpringDoc / Swagger UI ──────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# ─── VIX Monitor ──────────────────────────────────────────────────────────────────
vix:
  fetch-interval-minutes: 5
  persist-interval-minutes: 15
  alert-threshold: 20.0

# ─── Max Pain Calculator ──────────────────────────────────────────────────────────
maxpain:
  persist-interval-minutes: 30
  cache-ttl-minutes: 15
  lot-sizes:
    NIFTY50: 75
    NIFTYBANK: 30

# ─── Telegram Alerts ──────────────────────────────────────────────────────────────
telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}

# ─── Strategy Configuration ───────────────────────────────────────────────────────
strategy:
  expiry-day:
    max-vix: 18.0
    latest-entry-time: "12:30"
    min-credit: 20.0
    min-distance-from-spot: 100
    max-lots: 1
    stop-loss-percent: 100
    target-profit-percent: 50
  mark-to-market-interval-ms: 60000

# ─── Trading Configuration ───────────────────────────────────────────────────────
trading:
  mode: paper
  symbols:
    - NIFTY
    - BANKNIFTY
  paper:
    enabled: true
    lot-size:
      NIFTY: 75
      BANKNIFTY: 30

# ─── Risk Configuration ──────────────────────────────────────────────────────────
risk:
  max-position-size-per-symbol: 5
  daily-loss-limit-percent: 2.0
  max-sector-exposure: 50000
  min-margin-buffer-percent: 10
  position-sizing:
    risk-percent: 1.0
    max-quantity: 10

# ─── Logging ─────────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.trademesh: DEBUG
    org.springframework.r2dbc: DEBUG
    liquibase: INFO
