# ═══════════════════════════════════════════════════════════════════════════════
# TradeMesh — Application Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# Structure:
#   1. Server
#   2. Spring Core (R2DBC, DataSource, Liquibase, Redis)
#   3. External Services (Zerodha, Telegram)
#   4. API Docs (SpringDoc)
#   5. Market Intelligence
#   6. Trading Engine
#   7. Strategies
#   8. Risk Management
#   9. Logging
# ═══════════════════════════════════════════════════════════════════════════════

# ─── 1. Server ───────────────────────────────────────────────────────────────
server:
  port: 8080

# ─── 2. Spring Core ──────────────────────────────────────────────────────────
spring:
  application:
    name: trade-mesh

  # R2DBC / PostgreSQL (reactive database access)
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trade_mesh_db}?schema=trade_mesh
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    pool:
      enabled: true
      initial-size: 2
      max-size: 10
      max-idle-time: 30m

  # JDBC DataSource (used by Liquibase only — not for app queries)
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trade_mesh_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # Liquibase (schema migrations)
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: trade_mesh
    liquibase-schema: trade_mesh

  # Disable Spring SQL init — Liquibase handles all schema creation
  sql:
    init:
      mode: never

  # Redis (token store, option chain cache, tick price cache)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}          # leave blank for no-auth local Redis Note: default is blank password on localhost
      timeout: 30s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms


# ─── 3. External Services(Zerodha / Kite Connect)────────────────────────────────────────────────────
zerodha:
  kite:
    api-key: ${ZERODHA_API_KEY}
    api-secret: ${ZERODHA_API_SECRET}
    redirect-url: ${ZERODHA_REDIRECT_URL:http://localhost:8080/zerodha/callback}
    base-url: https://api.kite.trade
    login-url: https://kite.zerodha.com/connect/login
    access-token-ttl-hours: 8
    # Kite /instruments returns ~5-8MB CSV. Buffer set to 20MB in WebClientConfig.
    # Instruments are fetched once per day and cached in Redis for 24 hours.
    instruments-buffer-size-mb: 20MB

  # Polls Redis every 5 minutes to detect token expiry and send Telegram re-auth alert
  token-check-interval-ms: 300000

  ticker:
    instruments:
      nifty50-token: 256265       # NIFTY 50 index instrument token
      niftybank-token: 260105     # NIFTY BANK index instrument token
    price-cache-ttl-seconds: 60   # Redis TTL for cached tick prices
    health-check-interval-ms: 30000   # WebSocket health-check interval
    max-reconnect-alerts: 10      # Max reconnect attempts before ERROR log

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}

# ─── 4. API Docs ─────────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# ─── 5. Market Intelligence ──────────────────────────────────────────────────
intelligence:
  market-data:
    fetch-interval-minutes: "0 */5 9-15 ? * MON-FRI"
    cache-ttl-minutes: 10
  vix:
    fetch-interval-cron: "0 */5 9-15 ? * MON-FRI"
    persist-interval-cron: "0 */15 9-15 ? * MON-FRI"
    fetch-interval-minutes: "5"
    persist-interval-minutes: "15"
    alert-threshold: 20.0
  maxpain:
    persist-interval-minutes: "0 */30 9-15 ? * MON-FRI"
    cache-ttl-minutes: 15
  oi:
    persist-interval-minutes: "0 */15 9-15 ? * MON-FRI"

# ─── 6. Trading Engine ───────────────────────────────────────────────────────
trading:
  mode: paper                     # paper | live
  expiry-day: THU                 # NSE options expiry day — update if NSE changes
  symbols:
    - NIFTY50
    - NIFTYBANK
  mark-to-market-interval-ms: 60000   # How often open trades are marked to market
  lot-sizes:
    NIFTY50: 65
    NIFTYBANK: 30
  paper:
    enabled: true

# ─── 7. Strategies ───────────────────────────────────────────────────────────
# All strategies share the same config structure.
# Set enabled: false for strategies not yet implemented.
# allowed-days: days of week this strategy is allowed to trade
# applicable-conditions: market conditions that trigger this strategy
# min/max-vix: VIX range within which the strategy is allowed to trade
# latest-entry-time: no new trades after this time (HH:mm, IST)
# min-credit: minimum premium collected to justify the trade (points)
# min-distance-from-spot: minimum strike distance from spot price (points)
# stop-loss-percent: exit if loss reaches this % of credit collected
# target-profit-percent: exit if profit reaches this % of credit collected
trading-strategies:
  items:
  - name: EXPIRY_DAY_STRANGLE
    enabled: true
    allowed-days: [TUESDAY]
    applicable-conditions: [EXPIRY_DAY]
    max-vix: 18.0
    min-vix: 10.0
    latest-entry-time: "12:30"
    min-credit: 20.0
    min-distance-from-spot: 100
    max-lots: 1
    stop-loss-percent: 100.0
    target-profit-percent: 50.0
    extra:
      min-distance-atr-multiplier: 0.4

  - name: BULL_PUT_SPREAD
    enabled: true
    allowed-days: [MONDAY, WEDNESDAY, THURSDAY, FRIDAY]
    applicable-conditions: [TRENDING_BULLISH]
    max-vix: 20.0
    min-vix: 10.0
    latest-entry-time: "13:00"
    min-credit: 20.0
    max-lots: 1
    stop-loss-percent: 100.0
    target-profit-percent: 50.0
    extra:
      dte-min: 1
      dte-max: 4
      dte-exit-threshold: 1
      target-delta: 0.30
      wing-width: 100
      strike-step: 50
      min-credit-pct: 0.10
      vix-panic-threshold: 25.0

  - name: BEAR_CALL_SPREAD
    enabled: true
    allowed-days: [MONDAY, WEDNESDAY, THURSDAY, FRIDAY]
    applicable-conditions: [TRENDING_BEARISH]
    max-vix: 20.0
    min-vix: 10.0
    latest-entry-time: "13:00"
    min-credit: 20.0
    max-lots: 1
    stop-loss-percent: 100.0
    target-profit-percent: 50.0
    extra:
      dte-min: 1
      dte-max: 4
      dte-exit-threshold: 1
      target-delta: 0.30
      wing-width: 100
      strike-step: 50
      min-credit-pct: 0.10
      vix-panic-threshold: 25.0

  - name: IRON_CONDOR
    enabled: true
    allowed-days: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
    applicable-conditions: [SIDEWAYS]
    max-vix: 20.0
    min-vix: 12.0
    latest-entry-time: "13:00"
    min-credit: 30.0
    max-lots: 1
    stop-loss-percent: 100.0
    target-profit-percent: 50.0
    extra:
      target-delta: 0.18
      wing-width: 200
      strike-step: 50
      min-credit-pct: 0.15
      min-score: 60
      ivr-min: 20.0
      ivr-max: 80.0
      iv-hv-ratio-min: 1.1
      atr-pct-max: 1.0
      dte-min: 1
      dte-max: 4
      dte-exit-threshold: 2
      atr-calm-threshold: 0.7
      atr-high-threshold: 1.0
      calm-target-multiplier: 0.9
      calm-sl-multiplier: 0.8
      high-target-multiplier: 1.1
      high-sl-multiplier: 1.2
      vix-panic-threshold: 25.0
      force-close-time: "15:15"

# ─── 8. Risk Management ──────────────────────────────────────────────────────
risk:
  max-position-size-per-symbol: 5
  daily-loss-limit-percent: 2.0
  max-sector-exposure: 50000
  min-margin-buffer-percent: 10
  position-sizing:
    risk-percent: 1.0
    max-quantity: 10

# ─── 9. Logging ──────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.trademesh: DEBUG
    org.springframework.r2dbc: DEBUG
    reactor.netty: INFO
    io.netty: INFO
    liquibase: INFO
