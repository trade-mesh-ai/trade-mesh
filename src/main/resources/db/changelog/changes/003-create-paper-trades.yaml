databaseChangeLog:

  # ─── paper_trades ──────────────────────────────────────────────────────────────
  - changeSet:
      id: 003-create-paper-trades
      author: trade-mesh
      comment: "Paper trading records for simulated trades"
      changes:
        - createTable:
            schemaName: trade_mesh
            tableName: paper_trades
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: trade_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: symbol
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: strategy_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: legs
                  type: JSONB
                  constraints:
                    nullable: true
              - column:
                  name: entry_credit
                  type: NUMERIC(18,4)
                  constraints:
                    nullable: false
              - column:
                  name: current_value
                  type: NUMERIC(18,4)
                  constraints:
                    nullable: true
              - column:
                  name: realized_pnl
                  type: NUMERIC(18,4)
                  constraints:
                    nullable: true
              - column:
                  name: unrealized_pnl
                  type: NUMERIC(18,4)
                  constraints:
                    nullable: true
              - column:
                  name: entry_time
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: exit_time
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: true
              - column:
                  name: exit_reason
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

        # Create indexes for common queries
        - createIndex:
            schemaName: trade_mesh
            tableName: paper_trades
            indexName: idx_paper_trades_status
            columns:
              - column:
                  name: status
        
        - createIndex:
            schemaName: trade_mesh
            tableName: paper_trades
            indexName: idx_paper_trades_symbol
            columns:
              - column:
                  name: symbol
        
        - createIndex:
            schemaName: trade_mesh
            tableName: paper_trades
            indexName: idx_paper_trades_strategy_name
            columns:
              - column:
                  name: strategy_name
        
        - createIndex:
            schemaName: trade_mesh
            tableName: paper_trades
            indexName: idx_paper_trades_trade_date
            columns:
              - column:
                  name: trade_date
        
        - createIndex:
            schemaName: trade_mesh
            tableName: paper_trades
            indexName: idx_paper_trades_trade_date_symbol
            columns:
              - column:
                  name: trade_date
              - column:
                  name: symbol
